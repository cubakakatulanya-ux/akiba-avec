plugins { id 'com.android.application' }

/* Les fichiers d'Akiba ne sont pas recopiés dans ce dossier : ils sont pris dans docs/, qui est
   exactement la version en ligne. Une seule version à tenir à jour, et l'application ne peut pas
   diverger du site. */
android {
  namespace 'com.ubora.akiba'
  compileSdk 34

  defaultConfig {
    minSdk 24                           // Android 7 : les terminaux POS les plus anciens encore en service
    targetSdk 34
    /* Le numéro de fabrication, passé par GitHub. Il monte à chaque fabrication, ce qui fait
       qu'une installation remplace la précédente sur le terminal au lieu d'être refusée. */
    versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
    versionName '1.0.' + (project.hasProperty('versionCode') ? project.versionCode : '0')
  }

  /* Deux applications, une seule source — comme pour le site.
       avec  : le cahier des groupes, sur akiba.uborardc.com
       suivi : l'outil des animateurs et des organisations, sur akibas.uborardc.com

     Chacune porte son propre identifiant : les deux s'installent côte à côte sur le même
     terminal, chacune avec ses données, et une mise à jour de l'une ne touche pas l'autre.
     Le domaine est écrit dans le code fabriqué (BuildConfig), pas dans le Java : c'est la même
     classe qui sert aux deux, et elle ne peut pas se tromper d'adresse. */
  flavorDimensions += 'application'
  productFlavors {
    avec {
      dimension 'application'
      applicationId 'com.ubora.akiba'
      resValue 'string', 'app_name', 'Akiba'
      buildConfigField 'String', 'DOMAINE', '"akiba.uborardc.com"'
    }
    suivi {
      dimension 'application'
      applicationId 'com.ubora.akiba.suivi'
      resValue 'string', 'app_name', 'Akiba Suivi'
      buildConfigField 'String', 'DOMAINE', '"akibas.uborardc.com"'
    }
  }

  buildFeatures { buildConfig true }

  sourceSets {
    /* Les fichiers de chaque application sont pris dans son dossier publié : une seule version
       à tenir à jour, et l'application ne peut pas diverger de son site. */
    avec { assets.srcDirs += ['../../docs'] }
    suivi { assets.srcDirs += ['../../docs-suivi'] }
  }

  /* La signature. Elle prouve qu'une Akiba installée sur un terminal vient bien d'Ubora, et
     c'est elle qui permet à une mise à jour de s'installer par-dessus la précédente.

     La clé n'est pas ici et n'y sera jamais : la fabrique la reçoit des secrets du dépôt. Sur
     un ordinateur qui ne les a pas, la construction retombe sur la clé de développement — ce
     qui dépanne pour essayer, mais ne doit pas sortir du bureau : cette clé-là est publique et
     partagée par tous les projets Android du monde, donc elle ne prouve rien. */
  signingConfigs {
    ubora {
      def magasin = System.getenv("AKIBA_MAGASIN")
      if (magasin) {
        storeFile file(magasin)
        storeType "PKCS12"
        storePassword System.getenv("AKIBA_MOTDEPASSE")
        keyAlias "akiba"
        keyPassword System.getenv("AKIBA_MOTDEPASSE")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false               // il n'y a presque pas de code Java : rien à réduire
      signingConfig System.getenv("AKIBA_MAGASIN") ? signingConfigs.ubora : signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  androidResources {
    /* Ce qui est sur le site mais n'a rien à faire dans l'application. En tête : le fichier de
       l'application lui-même, déposé dans docs/ par la fabrique — sans cette ligne, chaque
       nouvelle version embarquerait la précédente et doublerait de taille à chaque fois. */
    ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!akiba.apk:!akiba-apk.txt:!akiba-suivi.apk:!akiba-suivi-apk.txt:!sitemap.xml:!robots.txt:!CNAME:!LANCER.md'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  /* WebViewAssetLoader : sert les fichiers embarqués sous l'adresse du site, pour que
     l'application et la page web partagent la même origine — donc les mêmes données. */
  implementation 'androidx.webkit:webkit:1.11.0'

  /* Akiba n'écrit pas une ligne de Kotlin, mais les bibliothèques androidx en apportent la
     base commune — et deux d'entre elles n'en demandent pas la même version. Les mêmes classes
     arrivent alors deux fois et la construction s'arrête. On fixe donc une version unique. */
  constraints {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
  }
}
